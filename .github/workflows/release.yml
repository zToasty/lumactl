name: Release

on:
  push:
    tags:
      - 'v*' # Срабатывает только при пуше тегов, начинающихся с "v" (например, v1.0.0)

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Версия Go

      - name: Build for Linux (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o lumactl-linux-amd64 main.go

      - name: Build for Linux (arm64 - Raspberry Pi)
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -ldflags="-s -w" -o lumactl-linux-arm64 main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lumactl-linux-amd64
            lumactl-linux-arm64
          generate_release_notes: true
